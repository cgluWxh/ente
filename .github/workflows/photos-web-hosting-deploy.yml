name: "Deploy (Photos to GitHub Pages)"

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: photos-web-hosting-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        defaults:
            run:
                working-directory: web

        steps:
            - name: Checkout source
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            - name: Setup Rust for WASM
              shell: bash
              run: |
                  rustup target add wasm32-unknown-unknown
                  cd ../rust/bindings/wasm/cast
                  rustup show active-toolchain
                  rustup target add wasm32-unknown-unknown

            - name: Install dependencies
              run: npm ci

            - name: Build Photos
              run: npm run build:photos
              env:
                  NEXT_PUBLIC_ENTE_ENDPOINT: https://ente.831.moe

            - name: Prepare GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Prepare deployment files
              shell: bash
              run: |
                  printf 'photos.831.moe\n' > apps/photos/out/CNAME
                  touch apps/photos/out/.nojekyll

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: web/apps/photos/out
                  include-hidden-files: true

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
